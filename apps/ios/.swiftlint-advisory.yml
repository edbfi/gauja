included: [App, AppTests, AppUITests, HelloTests, Packages]
excluded: ["**/Generated", "**/.build", "**/Package.swift"]
only_rules: [file_length, function_body_length, type_body_length, cyclomatic_complexity]
file_length:
  warning: 300
function_body_length:
  warning: 40
type_body_length:
  warning: 300
cyclomatic_complexity:
  warning: 10
