# Seerr v3.4.1 local login selects id/email/password/plexId and returns user.filter().
# Recorded with the initialized local-auth scenario: no email or timestamps are returned.
# Evidence: https://github.com/seerr-team/seerr/blob/69f73a6f1486fdb51b8ddae9a94a8dfb629f461c/server/routes/auth.ts#L727-L761
overlay: 1.0.0
info:
  title: Local login returns a filtered authentication result
  version: 1.0.0
actions:
- target: $.paths['/auth/local'].post.responses['200'].content['application/json'].schema
  remove: true
- target: $.paths['/auth/local'].post.responses['200'].content['application/json']
  update:
    schema:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        permissions:
          type: number
        requestCount:
          type: number
        warnings:
          type: array
          items:
            type: string
      required: [id]
