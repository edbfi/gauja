# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Runs on every PR and on pushes to main (PRD §14.2): the same hooks as prek.toml,
# REUSE lint, a full-history gitleaks scan, the commit-message mirror of the commit-msg
# hooks, the tool-script tests and the apps/android ↔ apps/ios boundary check.
# Required status checks on main: REUSE, prek, commit-messages (the DCO check), gitleaks, tool-tests, boundary.
name: ci

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  prek:
    name: prek
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: j178/prek-action@v3.0.0
        env:
          # Branch guard is local; codegen-check owns contract validation and
          # tokens-check owns theme drift; native lanes own platform lint.
          SKIP: no-commit-to-branch,api-drift,tokens-check,ktfmt,detekt,swift-format,swiftlint
        with:
          extra-args: --all-files

          prek-version: 0.5.2
      - run: git diff --exit-code HEAD
    timeout-minutes: 30
  reuse:
    name: REUSE
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@v6.0.0

    timeout-minutes: 30
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks binary is MIT; gitleaks-action is under a proprietary EULA, so the
      # binary is downloaded from the release and checksum-verified instead.
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan history
        run: gitleaks git --redact --no-banner --exit-code 1 .

    timeout-minutes: 30
  commit-messages:
    name: commit-messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conventional Commits and DCO sign-off on every commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            tools/ci/check-commit-messages.sh --title "$PR_TITLE" "$PR_BASE" "$PR_HEAD"
          else
            base="$PUSH_BASE"
            if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
              base=$(git merge-base origin/main "$CI_HEAD")
              if [[ "$base" == "$CI_HEAD" ]]; then base=$(git rev-parse "$CI_HEAD^"); fi
            fi
            tools/ci/check-commit-messages.sh "$base" "$CI_HEAD"
          fi

    timeout-minutes: 30
  tool-tests:
    name: tool-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: tools/contract/python.sh --install
      - run: tools/tests/run.sh

    timeout-minutes: 30
  boundary:
    name: boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: apps/android and apps/ios never reference each other (PRD §13)
        run: |
          status=0
          if [[ -d apps/android ]] && grep -rIn --exclude-dir=build --exclude-dir=.gradle 'apps/ios' apps/android; then
            echo '::error::apps/android references apps/ios'; status=1
          fi
          if [[ -d apps/ios ]] && grep -rIn --exclude-dir=.build --exclude-dir=DerivedData 'apps/android' apps/ios; then
            echo '::error::apps/ios references apps/android'; status=1
          fi
          exit $status
    timeout-minutes: 30
  android:
    uses: ./.github/workflows/android.yml
  ios:
    uses: ./.github/workflows/ios.yml
  codegen-check:
    uses: ./.github/workflows/codegen-check.yml
  tokens-check:
    uses: ./.github/workflows/tokens-check.yml
  contract:
    uses: ./.github/workflows/contract.yml
  required:
    name: ci / required
    if: always()
    needs:
      - prek
      - reuse
      - gitleaks
      - commit-messages
      - tool-tests
      - boundary
      - android
      - ios
      - codegen-check
      - tokens-check
      - contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/gate@v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          required: prek reuse gitleaks commit-messages tool-tests boundary android ios codegen-check tokens-check contract
