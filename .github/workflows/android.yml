name: android
on:
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Record build identity
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-ci"
          {
            date -u
            git show -s --format=fuller HEAD
            printf 'PR head=%s\nPR base=%s\nRun=%s\nAttempt=%s\nImage=%s\n' "$PR_HEAD" "$PR_BASE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ImageVersion"
            lscpu
            free -h
            df -h
          } > "$RUNNER_TEMP/native-ci/host.txt"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Expose installed Android tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - run: sdkmanager 'platforms;android-37.0'
      - run: tools/contract/python.sh --install
      - run: python3 tools/contract/bundle-resources.py --check
      - run: tools/codegen/generate.sh --check --platform android
      - run: apps/android/gradlew --project-dir apps/android assembleDebug assembleRelease testDebugUnitTest :core:api:test :core:model:test :core:common:test :core:compat:test :core:network:testDebugUnitTest detekt ktfmtCheck lint buildHealth exportResolvedDependencies
      - run: tools/ci/check-module-graph.sh
      - run: python3 tools/ci/check-api-boundary.py
      - run: python3 tools/ci/check-licenses.py android
      - run: python3 tools/ci/replay-contract.py android
      - run: tools/ci/egress-test.sh android
      - run: python3 tools/ci/hello-server.py android
      - name: Per-ABI release APK sizes
        run: ls -l apps/android/app/build/outputs/apk/release/*.apk
      - name: Retain Android build evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-ci
            apps/android/app/build/outputs/apk
            apps/android/**/build/reports
            apps/android/**/build/test-results
          retention-days: 7
          if-no-files-found: error
    timeout-minutes: 45
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: ['30', '37.0']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Record runner and expose installed Android tools
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-ci/provision"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/gauja-android/avd" >> "$GITHUB_ENV"
          {
            date -u
            git show -s --format=fuller HEAD
            printf 'PR head=%s\nPR base=%s\nRun=%s\nAttempt=%s\nImage=%s\n' "$PR_HEAD" "$PR_BASE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ImageVersion"
            uname -a
            lscpu
            free -h
            df -h
          } > "$RUNNER_TEMP/native-ci/provision/host.txt"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Provision emulator and run real instrumentation
        env:
          API: ${{ matrix.api }}
        run: |
          export ANDROID_USER_HOME="$HOME/.android"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          evidence="$RUNNER_TEMP/native-ci"
          system_image="system-images;android-$API;google_apis;x86_64"
          sdkmanager 'emulator' 'platforms;android-37.0' "$system_image" > "$evidence/provision/sdk-install.log" 2>&1
          sdkmanager --list_installed > "$evidence/provision/sdk-packages.txt"
          cat "$ANDROID_HOME/cmdline-tools/latest/source.properties" > "$evidence/provision/command-line-tools.properties"
          emulator="$ANDROID_HOME/emulator/emulator"
          memory=2048
          revision=16
          if [[ "$API" == '37.0' ]]; then
            memory=4096
            revision=6
            # Qualify replacements with two fresh native runs before changing this pairing.
            archive_sha256=95771e0ae431897b2a4bd2d97fa095f29a8b0624a7b216baf529f9306161c266
            curl --fail --location --retry 2 --connect-timeout 30 --max-time 180 \
              https://dl.google.com/android/repository/emulator-linux_x64-15917651.zip -o "$RUNNER_TEMP/gauja-emulator.zip"
            echo "$archive_sha256  $RUNNER_TEMP/gauja-emulator.zip" | sha256sum -c -
            sha256sum "$RUNNER_TEMP/gauja-emulator.zip" > "$evidence/provision/archive-sha256.txt"
            unzip -q "$RUNNER_TEMP/gauja-emulator.zip" -d "$RUNNER_TEMP/gauja-emulator"
            emulator="$RUNNER_TEMP/gauja-emulator/emulator/emulator"
          fi
          echo no | avdmanager create avd --name gauja-smoke --device pixel_4 --package "$system_image" > "$evidence/provision/avd-create.log" 2>&1
          sed -i '/^disk.dataPartition.size=/d' "$ANDROID_AVD_HOME/gauja-smoke.avd/config.ini"
          echo 'disk.dataPartition.size=10G' >> "$ANDROID_AVD_HOME/gauja-smoke.avd/config.ini"
          cp "$ANDROID_AVD_HOME/gauja-smoke.ini" "$evidence/provision/root-avd-before.ini"
          # The helper validates this target and repairs the API 37.0 -> android-0
          # conversion in older AVD Manager versions before starting the emulator.
          python3 tools/ci/android-smoke.py --emulator "$emulator" --avd gauja-smoke \
            --serial emulator-5554 --api "$API" --image-revision "$revision" \
            --memory-mib "$memory" --evidence-dir "$evidence/smoke"
      - name: Retain emulator and instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-smoke-${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-ci
          retention-days: 7
          if-no-files-found: error
