# Initial public flow only; Phase 11 adds initialized/seeding/auth and complete operation coverage.
name: contract
on:
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: 17 6 * * 1
permissions:
  contents: read
jobs:
  public-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: tools/contract/python.sh --install
      - name: Build pinned upstream Dockerfile and probe public operations
        run: |
          pin="$(head -n 1 api/UPSTREAM_COMMIT)"
          mkdir -p .cache/seerr-source
          curl --fail --location "https://api.github.com/repos/seerr-team/seerr/tarball/$pin" | tar -xz --strip-components=1 -C .cache/seerr-source
          docker build --build-arg COMMIT_TAG="$pin" -t gauja-contract .cache/seerr-source
          docker run -d --name gauja-contract -p 127.0.0.1:5057:5055 -e LOG_LEVEL=error gauja-contract
          trap 'docker rm -f gauja-contract' EXIT
          timeout 180 bash -c 'until curl --silent --fail "http://127.0.0.1:5057/api/v1/status?checkUpdateAvailable=false" >/dev/null; do sleep 2; done'
          tools/contract/python.sh tools/ci/public-contract.py --base http://127.0.0.1:5057
    timeout-minutes: 30
concurrency:
  group: contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
