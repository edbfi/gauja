name: ios
on:
  workflow_call: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Record runner and checkout
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-ci"
          {
            date -u
            git show -s --format=fuller HEAD
            printf 'PR head=%s\nPR base=%s\nRun=%s\nAttempt=%s\nImage=%s\n' "$PR_HEAD" "$PR_BASE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ImageVersion"
            sw_vers
            uname -m
          } > "$RUNNER_TEMP/native-ci/host.txt"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - run: tools/ci/install-apple-tools.sh
      - run: tools/contract/python.sh --install
      - run: tools/codegen/generate.sh --check --platform ios
      - run: tools/ci/check-swift.sh
      - run: tools/ci/check-package-graph.sh
      - run: python3 tools/ci/check-api-boundary.py
      - name: Generate and build app
        working-directory: apps/ios
        run: |
          xcodegen generate
          mkdir -p Gauja.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved Gauja.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -project Gauja.xcodeproj -scheme Gauja -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile build CODE_SIGNING_ALLOWED=NO
      - name: Swift Testing packages
        run: |
          for package in Model Compat SeerrAPI Network Data; do
            swift test --package-path "apps/ios/Packages/$package" --disable-automatic-resolution
          done
      - run: python3 tools/ci/check-licenses.py ios
      - run: python3 tools/ci/replay-contract.py ios
      - run: tools/ci/egress-test.sh ios
      - name: Phone and tablet smoke
        run: |
          xcodebuild -downloadPlatform iOS
          xcodes runtimes install "iOS 18.6"
          python3 tools/ci/ios-smoke.py --evidence-dir "$RUNNER_TEMP/native-ci/smoke"
      - name: Device architecture size report
        working-directory: apps/ios
        run: |
          xcodebuild -project Gauja.xcodeproj -scheme Gauja -configuration Release -destination 'generic/platform=iOS' -derivedDataPath DerivedData -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile build CODE_SIGNING_ALLOWED=NO DEPLOYMENT_POSTPROCESSING=YES STRIP_INSTALLED_PRODUCT=YES
          du -sk DerivedData/Build/Products/Release-iphoneos/Gauja.app | tee "$RUNNER_TEMP/native-ci/device-size.txt"
      - name: Retain native test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-ci
          retention-days: 7
          if-no-files-found: error
