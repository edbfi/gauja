name: codegen-check

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codegen-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: tools/contract/python.sh --install
      - name: Validate each commit and the current contract
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            BASE=$(git merge-base origin/main "$HEAD")
            if [[ "$BASE" == "$HEAD" ]]; then BASE=$(git rev-parse "$HEAD^"); fi
          fi
          tools/api-drift/check-local.sh --range "$BASE" "$HEAD"
      - name: Verify vendored bytes at the pin
        run: tools/contract/python.sh tools/api-drift/check-upstream.py
    timeout-minutes: 30
