name: tokens-check

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tokens:
    name: tokens-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: tools/tokens/generate.sh --check
    timeout-minutes: 30
  ios-primitives:
    name: tokens-ios
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
      - name: Typecheck generated SwiftUI primitives at iOS 18 floor
        run: |
          xcrun swiftc -typecheck -swift-version 6 -default-isolation MainActor \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target arm64-apple-ios18.0-simulator \
            apps/ios/Packages/DesignSystem/Sources/DesignSystem/Generated/*.swift
    timeout-minutes: 30
concurrency:
  group: tokens-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
